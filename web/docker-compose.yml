version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: agi-robot-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: agi-robot
    volumes:
      - mongodb_data:/data/db
    networks:
      - agi-robot-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/agi-robot --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agi-robot-backend
    restart: unless-stopped
    ports:
      - "8300:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongodb:27017/agi-robot
      - PORT=3000
      - CORS_ORIGIN=https://robot.mvpgen.com
      - PYTHON_MEDIA_SERVICE_URL=http://host.docker.internal:5000
      - GEMINI_KEY=${GEMINI_KEY}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - agi-robot-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Frontend (Nginx serving React app)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agi-robot-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - agi-robot-network

volumes:
  mongodb_data:
    driver: local

networks:
  agi-robot-network:
    driver: bridge
